[package]
name = "pkey-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "pkey_app"
path = "src/lib.rs"

[features]
# Test-only: the hook also obeys keys injected with a magic `dwExtraInfo`, so an automated test can
# type into its own window. Never enabled in a release build.
test-hooks = []

[[bin]]
name = "pkey"
path = "src/main.rs"

[dependencies]
ime-runtime.workspace = true
ime-winkeys.workspace = true
ime-unicode.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
