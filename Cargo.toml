[workspace]
resolver = "2"
members = [
    "crates/ime-unicode",
    "crates/ime-vietnamese",
    "crates/ime-core",
    "crates/ime-testing",
    "apps/ime-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
publish = false

[workspace.dependencies]
bitflags = "2"
clap = { version = "4", features = ["derive"] }
proptest = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
unicode-normalization = "0.1"
unicode-segmentation = "1"

ime-unicode = { path = "crates/ime-unicode" }
ime-vietnamese = { path = "crates/ime-vietnamese" }
ime-core = { path = "crates/ime-core" }
ime-testing = { path = "crates/ime-testing" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
debug = "line-tables-only"
strip = "symbols"
