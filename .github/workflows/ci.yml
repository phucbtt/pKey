name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        env:
          # The C ABI harness must run on CI instead of being skipped.
          PKEY_REQUIRE_C_HARNESS: "1"
        run: cargo test --workspace

  c-harness-sanitizers:
    name: C ABI harness under ASan/UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: harness with sanitizers
        env:
          PKEY_REQUIRE_C_HARNESS: "1"
          PKEY_C_SANITIZE: address,undefined
          CC: clang
        run: cargo test -p ime-ffi --test c_harness -- --nocapture

  # The IBus engine is one static (musl) binary, so a build made here must work on every Ubuntu
  # release that has IBus: the same binary is exercised against the IBus of an old and a new LTS.
  linux-ibus:
    name: IBus end-to-end (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: install IBus and its Python bindings
        run: sudo apt-get update && sudo apt-get install -y ibus python3-gi gir1.2-ibus-1.0
      - name: allow the private mount namespace the test uses
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: build the static engine
        run: cargo build --profile dist -p pkey-ibus --target x86_64-unknown-linux-musl
      - name: type Vietnamese through a real ibus-daemon
        run: scripts/linux/e2e-ibus.sh target/x86_64-unknown-linux-musl/dist/ibus-engine-pkey
      - name: build the .deb
        run: scripts/linux/build-deb.sh

  # Stable Rust needs Windows 10, so the Windows build that also runs on Windows 7 SP1 and 8.x is
  # built from source on a pinned nightly (scripts/windows/win7-toolchain.txt). There is no Windows 7
  # runner, so the guard is static: no import of a DLL that Windows 7 lacks.
  windows-7:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: install the pinned nightly
        shell: pwsh
        run: |
          $tc = (Get-Content scripts/windows/win7-toolchain.txt -TotalCount 1).Trim()
          "TOOLCHAIN=$tc" | Out-File -Append -Encoding ascii $env:GITHUB_ENV
          rustup toolchain install $tc --profile minimal -c rust-src
      - uses: Swatinem/rust-cache@v2
      - name: build for Windows 7 and check imports
        shell: pwsh
        env:
          # RUSTFLAGS replaces .cargo/config.toml's flags, so the static C runtime is repeated here
          # (without it the build would import vcruntime140.dll, which a clean Windows 7 lacks).
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          . scripts/windows/win7-imports.ps1
          $std = '-Zbuild-std=std,panic_unwind'
          cargo "+$env:TOOLCHAIN" build -p pkey-app --profile dist --target i686-win7-windows-msvc $std
          if ($LASTEXITCODE -ne 0) { throw 'pkey-app build failed' }
          Assert-Win7Imports target/i686-win7-windows-msvc/dist/pkey.exe
          foreach ($t in 'x86_64-win7-windows-msvc', 'i686-win7-windows-msvc') {
            cargo "+$env:TOOLCHAIN" build -p pkey-tsf --release --target $t $std
            if ($LASTEXITCODE -ne 0) { throw "pkey-tsf build failed for $t" }
            $dll = "target/$t/release/pkey_tsf.dll"
            [void](Repair-Win7Imports $dll)
            Assert-Win7Imports $dll
          }

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
